# Bootstrap HTTP configuration; Certbot adds the TLS listener and redirect.
server {
    listen 80;
    server_name luiaiworld.com www.luiaiworld.com;
    root /var/www/luiaiworld/current;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri/ =404;
    }
    location ~ /\. {
        deny all;
    }
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    error_page 404 /404.html;
    location = /404.html { internal; }
}
